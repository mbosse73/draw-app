<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPMN Editor</title>
    <script>
      // Theme so früh wie möglich setzen, bevor der erste Frame gerendert wird -
      // sonst blitzt kurz das falsche Theme auf (siehe UI-DESIGNGUIDE.md Abschnitt 3).
      (function () {
        try {
          if (localStorage.getItem("bpmnEditorTheme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
